global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alertas.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: servidor
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: uptime-kuma
    static_configs:
      - targets: ["uptime-kuma:3001"]
    basic_auth:
      username: ""
      password_file: /etc/prometheus/kuma_password
